spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id:  ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  datasource:
      url: jdbc:postgresql://localhost:5432/SpringAuth
      driver-class-name: org.postgresql.Driver
      username: postgres
      password:  ${DB_PASSWORD}

  jpa:
      hibernate:
        ddl-auto: update
      show-sql: true






