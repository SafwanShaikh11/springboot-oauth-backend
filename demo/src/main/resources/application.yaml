spring:
  security:
    oauth2:
      client:
        registration:
          google:
            Client-id:
            Client-secret:

          scope:
            - email
            - profile

  datasource:
    url: jdbc:postgresql://postgres:5432/SpringAuth
    driver-class-name: org.postgresql.Driver
    username: postgres
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true






